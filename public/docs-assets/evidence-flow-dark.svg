<svg aria-labelledby="atlas-evidence-flow-title" id="atlas-evidence-flow" width="100%" xmlns="http://www.w3.org/2000/svg" class="flowchart" viewBox="4 4 184 300" role="img"><title id="atlas-evidence-flow-title">Source, then methodology, then observation, then citation fields.</title><style>#atlas-evidence-flow{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;fill:#ccc;}@keyframes edge-animation-frame{from{stroke-dashoffset:0;}}@keyframes dash{to{stroke-dashoffset:0;}}#atlas-evidence-flow .edge-animation-slow{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 50s linear infinite;stroke-linecap:round;}#atlas-evidence-flow .edge-animation-fast{stroke-dasharray:9,5!important;stroke-dashoffset:900;animation:dash 20s linear infinite;stroke-linecap:round;}#atlas-evidence-flow .error-icon{fill:#a44141;}#atlas-evidence-flow .error-text{fill:#ddd;stroke:#ddd;}#atlas-evidence-flow .edge-thickness-normal{stroke-width:1px;}#atlas-evidence-flow .edge-thickness-thick{stroke-width:3.5px;}#atlas-evidence-flow .edge-pattern-solid{stroke-dasharray:0;}#atlas-evidence-flow .edge-thickness-invisible{stroke-width:0;fill:none;}#atlas-evidence-flow .edge-pattern-dashed{stroke-dasharray:3;}#atlas-evidence-flow .edge-pattern-dotted{stroke-dasharray:2;}#atlas-evidence-flow .marker{fill:lightgrey;stroke:lightgrey;}#atlas-evidence-flow .marker.cross{stroke:lightgrey;}#atlas-evidence-flow svg{font-family:"trebuchet ms",verdana,arial,sans-serif;font-size:16px;}#atlas-evidence-flow p{margin:0;}#atlas-evidence-flow .label{font-family:"trebuchet ms",verdana,arial,sans-serif;color:#ccc;}#atlas-evidence-flow .cluster-label text{fill:#F9FFFE;}#atlas-evidence-flow .cluster-label span{color:#F9FFFE;}#atlas-evidence-flow .cluster-label span p{background-color:transparent;}#atlas-evidence-flow .label text,#atlas-evidence-flow span{fill:#ccc;color:#ccc;}#atlas-evidence-flow .node rect,#atlas-evidence-flow .node circle,#atlas-evidence-flow .node ellipse,#atlas-evidence-flow 