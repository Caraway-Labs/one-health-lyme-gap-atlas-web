name: Quality and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the reviewed commit to production after quality checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:api
      - run: git diff --exit-code -- contracts src/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - name: Run blocking E2E coverage except accepted mobile privacy defect
        run: >-
          npx playwright test --grep-invert "publishes an accessible, clear privacy summary without analytics claims"
      - name: Run blocking desktop privacy navigation coverage
        if: always()
        run: >-
          npx playwright test --project=desktop --grep "publishes an accessible, clear privacy summary without analytics claims"
      - name: Run accepted mobile privacy navigation coverage
        id: accepted_mobile_privacy_e2e
        if: always()
        continue-on-error: true
        run: >-
          npx playwright test --project=mobile --grep "publishes an accessible, clear privacy summary without analytics claims"
      - name: Document accepted mobile privacy result
        if: always()
        env:
          MOBILE_PRIVACY_OUTCOME: ${{ steps.accepted_mobile_privacy_e2e.outcome }}
        run: |
          if [[ "$MOBILE_PRIVACY_OUTCOME" == "success" ]]; then
            echo "## Mobile privacy navigation" >> "$GITHUB_STEP_SUMMARY"
            echo "Passed unexpectedly. Remove the pre-MVP defect acceptance in #126 and restore this case to the blocking E2E suite." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "## Mobile privacy navigation" >> "$GITHUB_STEP_SUMMARY"
            echo "Known pre-MVP failure observed and accepted under #126. The scenario ran; it remains non-blocking until the decision is revisited." >> "$GITHUB_STEP_SUMMARY"
          fi
      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.carawaylabs.com
          NEXT_PUBLIC_SITE_URL: https://carawaylabs.com
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ secrets.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: >-
          docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.carawaylabs.com --build-arg NEXT_PUBLIC_SITE_URL=https://carawaylabs.com --build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ secrets.NEXT_PUBLIC_AMPLITUDE_API_KEY }} --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }} .
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://carawaylabs.com
    concurrency: { group: web-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/app_action/deploy@v2
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        with: { token: "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" }
