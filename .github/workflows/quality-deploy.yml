name: Quality and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the reviewed commit to production after quality checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:api
      - run: git diff --exit-code -- contracts src/generated
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run test:e2e
      - run: npm run build
        env: { NEXT_PUBLIC_API_BASE_URL: https://api.carawaylabs.com }
      - run: docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.carawaylabs.com .
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
  deploy:
    if: github.event_name == 'workflow_dispatch' && inputs.deploy_production
    needs: quality
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://carawaylabs.com
    concurrency: { group: web-production, cancel-in-progress: false }
    steps:
      - uses: actions/checkout@v4
      - uses: digitalocean/app_action/deploy@v2
        with: { token: "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" }
