name: Quality and deploy

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      deploy_production:
        description: Deploy the reviewed commit to production after quality checks
        required: true
        type: boolean
        default: false

permissions:
  contents: read
  checks: write
  pull-requests: write

# CI_MAX_PARALLEL=4 is intent, not a semaphore. A GitHub concurrency group runs
# one member at a time, so it cannot cap CI at four slots. This workflow has no
# matrix, so strategy.max-parallel does not apply. Independent pull requests and
# main pushes stay concurrent up to the GitHub-hosted runner limit. Do not add a
# workflow-level concurrency group; that would serialize quality behind deploys.
# WEB_PRODUCTION_CONCURRENCY_GROUP and LATEST_MAIN_WINS are repository or
# organization Actions variables. Unset values use the defaults below.
env:
  CI_MAX_PARALLEL: ${{ vars.CI_MAX_PARALLEL || '4' }}

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Record CI parallelism intent
        run: >-
          echo "CI_MAX_PARALLEL=${CI_MAX_PARALLEL} app=web (intent only; quality runs are not serialized by production deploy concurrency)"
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Audit locked dependencies
        run: npm audit --audit-level=moderate
      - run: npx playwright install --with-deps chromium
      - run: npm run generate:api
      - run: git diff --exit-code -- contracts src/generated
      - run: npm run docs:check
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run check:design-system
      - run: npm run check:ux-reset
      - name: Unit tests + coverage (Vitest)
        run: |
          mkdir -p test-results
          npx vitest run --coverage --exclude 'tests/e2e/**' --exclude 'tests/auth-routes.test.ts' --exclude 'tests/account-page.test.tsx' --exclude 'tests/account-data-rights.test.tsx' --outputFile.junit=test-results/vitest-junit.xml

      - name: Auth/account unit tests (soft-fail)
        if: ${{ !cancelled() }}
        continue-on-error: true
        run: |
          mkdir -p test-results
          npx vitest run --coverage --coverage.reportOnFailure --coverage.reportsDirectory coverage/auth --outputFile.junit=test-results/vitest-auth-junit.xml tests/auth-routes.test.ts tests/account-page.test.tsx tests/account-data-rights.test.tsx

      - name: Upload Vitest JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-junit
          path: test-results/vitest-junit.xml
          if-no-files-found: warn

      - name: Upload Vitest auth JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vitest-auth-junit
          path: test-results/vitest-auth-junit.xml
          if-no-files-found: warn

      - name: Auth e2e shells (soft-fail)
        continue-on-error: true
        run: |
          mkdir -p test-results
          npx playwright test --grep "research and sign-in shells fail safely without authentication" --reporter=list --reporter=junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/playwright-auth-junit.xml

      - name: E2E tests (Playwright) with JUnit
        run: |
          mkdir -p test-results
          npx playwright test --grep-invert "research and sign-in shells fail safely without authentication" --reporter=list --reporter=junit
        env:
          PLAYWRIGHT_JUNIT_OUTPUT_FILE: test-results/playwright-junit.xml

      - name: Upload Playwright auth JUnit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-auth-junit
          path: test-results/playwright-auth-junit.xml
          if-no-files-found: warn

      - name: Upload Playwright JUnit + report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            test-results/playwright-junit.xml
            playwright-report/
          if-no-files-found: warn

      - name: Publish unit test results (PR check)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Vitest Results
          path: test-results/vitest-junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Publish auth unit test results (PR check)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Vitest Auth Results
          path: test-results/vitest-auth-junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Publish e2e test results (PR check)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Results
          path: test-results/playwright-junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Publish auth e2e test results (PR check)
        if: always()
        uses: dorny/test-reporter@v1
        with:
          name: Playwright Auth Results
          path: test-results/playwright-auth-junit.xml
          reporter: java-junit
          fail-on-error: false
          fail-on-empty: false

      - name: Upload coverage to Codecov
        if: always()
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: coverage/lcov.info
          flags: web-unit
          name: atlas-web
          fail_ci_if_error: false

      - run: npm run build
        env:
          NEXT_PUBLIC_API_BASE_URL: https://api.carawaylabs.com
          NEXT_PUBLIC_SITE_URL: https://carawaylabs.com
          NEXT_PUBLIC_KG_CHAT_ENABLED: "true"
          NEXT_PUBLIC_AMPLITUDE_API_KEY: ${{ secrets.NEXT_PUBLIC_AMPLITUDE_API_KEY }}
          NEXT_PUBLIC_AMPLITUDE_PROJECT_TARGET: production
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
      - run: >-
          docker build --build-arg NEXT_PUBLIC_API_BASE_URL=https://api.carawaylabs.com --build-arg NEXT_PUBLIC_SITE_URL=https://carawaylabs.com --build-arg NEXT_PUBLIC_DOCS_URL=https://carawaylabs.com/docs --build-arg NEXT_PUBLIC_KG_CHAT_ENABLED=true --build-arg NEXT_PUBLIC_AMPLITUDE_API_KEY=${{ secrets.NEXT_PUBLIC_AMPLITUDE_API_KEY }} --build-arg NEXT_PUBLIC_AMPLITUDE_PROJECT_TARGET=production --build-arg NEXT_PUBLIC_SUPABASE_URL=${{ secrets.NEXT_PUBLIC_SUPABASE_URL }} --build-arg NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY=${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }} .
      - name: Scan Git history for secrets
        run: >-
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f git /repo --redact --no-banner
  deploy-guard:
    name: production deploy guard
    needs: quality
    if: >-
      (github.event_name == 'push' && github.ref == 'refs/heads/main') || (github.event_name == 'workflow_dispatch' && inputs.deploy_production)
    runs-on: ubuntu-latest
    outputs:
      decision: ${{ steps.guard.outputs.decision }}
      candidate_sha: ${{ steps.guard.outputs.candidate_sha }}
      main_sha: ${{ steps.guard.outputs.main_sha }}
      reason: ${{ steps.guard.outputs.reason }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Compare candidate SHA with origin/main
        id: guard
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          LATEST_MAIN_WINS: ${{ vars.LATEST_MAIN_WINS || 'true' }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          export MAIN_SHA
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/production-deploy-guard.ts guard
  deploy:
    needs: [quality, deploy-guard]
    if: needs.deploy-guard.outputs.decision == 'proceed'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: https://carawaylabs.com
    # Former group name: web-production. Renamed so the web app does not share
    # a lock with any other service. In-flight runs started before this rename
    # still occupy web-production until they finish.
    concurrency:
      group: ${{ vars.WEB_PRODUCTION_CONCURRENCY_GROUP || 'atlas-web-production' }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Re-check latest main immediately before deploy
        id: guard
        env:
          CANDIDATE_SHA: ${{ github.sha }}
          LATEST_MAIN_WINS: ${{ vars.LATEST_MAIN_WINS || 'true' }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          git fetch --no-tags origin +refs/heads/main:refs/remotes/origin/main
          MAIN_SHA="$(git rev-parse refs/remotes/origin/main)"
          export MAIN_SHA
          node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/production-deploy-guard.ts guard
      - name: Deploy the validated commit to DigitalOcean App Platform
        id: production
        if: steps.guard.outputs.decision == 'proceed'
        uses: digitalocean/app_action/deploy@v2
        env:
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.NEXT_PUBLIC_SUPABASE_URL }}
          NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ${{ secrets.NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY }}
        with: { token: "${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}" }
      - name: Verify production Assistant is enabled
        id: smoke
        if: steps.production.outcome == 'success'
        run: |
          for attempt in {1..5}; do
            if curl --fail --silent --show-error https://carawaylabs.com/assistant | grep -q 'Your question'; then
              exit 0
            fi
            sleep 10
          done
          echo 'Production Assistant did not render its question form.' >&2
          exit 1
      - name: Record production deploy result
        if: always() && steps.guard.outputs.decision == 'proceed'
        env:
          CANDIDATE_SHA: ${{ steps.guard.outputs.candidate_sha }}
          MAIN_SHA: ${{ steps.guard.outputs.main_sha }}
          DEPLOY_REASON: ${{ steps.production.outcome != 'success' && 'digitalocean deploy failed' || steps.smoke.outcome != 'success' && 'Assistant production smoke failed' || 'digitalocean deploy and Assistant smoke succeeded' }}
          DEPLOY_RESULT: ${{ steps.production.outcome == 'success' && steps.smoke.outcome == 'success' && 'success' || 'failure' }}
          DEPLOY_BRANCH: ${{ github.ref_name }}
          DEPLOY_RUN_ID: ${{ github.run_id }}
          DEPLOY_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node --experimental-strip-types --disable-warning=ExperimentalWarning scripts/production-deploy-guard.ts record
