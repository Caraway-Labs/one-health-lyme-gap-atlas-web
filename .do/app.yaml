name: one-health-lyme-gap-atlas-web
region: sfo
domains:
  - domain: carawaylabs.com
    type: PRIMARY
    zone: carawaylabs.com
    minimum_tls_version: "1.2"
  - domain: www.carawaylabs.com
    type: ALIAS
    zone: carawaylabs.com
    minimum_tls_version: "1.2"
alerts:
  - rule: DEPLOYMENT_FAILED
  - rule: DOMAIN_FAILED
services:
  - name: web
    github:
      repo: Caraway-Labs/one-health-lyme-gap-atlas-web
      branch: main
      deploy_on_push: false
    dockerfile_path: Dockerfile
    http_port: 8080
    instance_count: 1
    instance_size_slug: basic-xxs
    health_check:
      http_path: /
      initial_delay_seconds: 20
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 5
    liveness_health_check:
      http_path: /
      initial_delay_seconds: 10
      period_seconds: 15
      timeout_seconds: 5
      failure_threshold: 5
    envs:
      - key: NEXT_PUBLIC_API_BASE_URL
        value: https://api.carawaylabs.com
        scope: BUILD_TIME
    alerts:
      - rule: CPU_UTILIZATION
        operator: GREATER_THAN
        value: 80
        window: FIVE_MINUTES
